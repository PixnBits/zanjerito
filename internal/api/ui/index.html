<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Zanjerito</title>
  <style>
    :root {
      /* Polish v1 Style A — Cards + desert light */
      --sand: #e8dcc8;
      --sand-deep: #d9cbb4;
      --cream: #f7f1e6;
      --cream-edge: #ebe3d4;
      --terracotta: #c45c3e;
      --terracotta-deep: #a8482f;
      --teal: #2a7a74;
      --teal-soft: #d5ebe8;
      --plum: #6b4a6e;
      --plum-soft: #efe4f0;
      --ink: #3a2a1f;
      --muted: #7a6a58;
      --warn: #c9a24a;
      --warn-ink: #3a2e10;
      --warn-bg: #f5e8c8;
      --off-badge: #9a8a78;
      --out-badge: #8a6a48;
      --out-ink: #5a3a20;
      --bg: var(--sand);
      --card: var(--cream);
      --stop: var(--terracotta);
      --go: var(--teal);
      --chip: var(--cream-edge);
      --on: var(--teal);
      --serif: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
      --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    .kiosk { font-size: 22px; }
    .kiosk .edit, .kiosk #page-schedules { display: none; }
    * { box-sizing: border-box; }
    body {
      margin: 0; font-family: var(--sans); background: var(--sand); color: var(--ink);
      /* Clear fixed STOP footer + gap so last card Edit/Duplicate stay fully above it */
      padding: 12px 12px calc(124px + env(safe-area-inset-bottom, 0px)); max-width: 480px; margin-inline: auto;
    }
    /* Chrome: wordmark + nav */
    .chrome {
      display: flex; align-items: baseline; justify-content: space-between;
      gap: 12px; margin: 4px 0 14px; flex-wrap: wrap;
    }
    .wordmark {
      font-family: var(--serif); font-size: 1.35rem; font-weight: 600;
      letter-spacing: .01em; color: var(--ink); margin: 0; line-height: 1.2;
    }
    .nav { display: flex; gap: 4px; margin: 0; }
    .nav button {
      flex: 0 0 auto; min-height: 40px; border-radius: 0; border: 0;
      background: transparent; color: var(--muted); font-size: 1rem;
      padding: 8px 12px; border-bottom: 3px solid transparent; font-weight: 500;
    }
    .nav button.active {
      color: var(--ink); border-bottom-color: var(--terracotta); font-weight: 650;
      background: transparent;
    }
    h1 { font-size: 1.05rem; margin: 0 0 8px; font-weight: 650; font-family: var(--serif); }
    /* Hero status card */
    .status {
      position: relative; overflow: hidden;
      background: var(--cream); border-radius: 18px; padding: 18px 16px 16px;
      min-height: 9.5rem; border: 1px solid var(--cream-edge);
      box-shadow: 0 1px 0 rgba(58,42,31,.04);
    }
    .status.watering { border-color: color-mix(in srgb, var(--teal) 35%, var(--cream-edge)); }
    .hero-top {
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
      margin-bottom: 6px; position: relative; z-index: 1;
    }
    .season-tag {
      display: inline-flex; align-items: center; gap: 6px;
      font-size: .78rem; color: var(--muted); letter-spacing: .02em;
      text-transform: uppercase; font-weight: 600;
    }
    .sun-accent {
      width: 14px; height: 14px; border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #f6e7a8, #e0a84a 70%, #c47a28);
      box-shadow: 0 0 0 2px rgba(224,168,74,.25);
      flex-shrink: 0;
    }
    .status .phase {
      font-family: var(--serif); font-size: 1.85rem; font-weight: 700;
      line-height: 1.15; position: relative; z-index: 1; margin: 2px 0 6px;
    }
    .status .timer {
      font-variant-numeric: tabular-nums; font-size: 1.15rem; font-weight: 700;
      color: var(--teal); margin: 0 0 6px; position: relative; z-index: 1;
      letter-spacing: .02em;
    }
    .status .timer.hidden { display: none; }
    .status .sub, .sub { color: var(--muted); margin-top: 2px; font-size: .95rem; position: relative; z-index: 1; }
    .status .next-line {
      margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--cream-edge);
      color: var(--ink); font-size: .95rem; position: relative; z-index: 1;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .status .next-line span { color: var(--muted); }
    .fault { color: #a8482f; }
    /* Desert line-art (CSS + SVG), not a photo */
    .desert-art {
      position: absolute; right: -4px; bottom: -2px; width: 118px; height: 88px;
      pointer-events: none; opacity: .55; z-index: 0;
    }
    .desert-art svg { width: 100%; height: 100%; display: block; }
    /* Station strip — fat cream / teal tiles */
    .strip-label { margin: 18px 0 8px; }
    .strip { display: flex; flex-wrap: wrap; gap: 10px; margin: 0 0 8px; }
    .chip, .station-tile {
      background: var(--cream); border: 1.5px solid var(--cream-edge); color: var(--ink);
      border-radius: 14px; padding: 14px 16px; font-size: 1.05rem; min-height: 52px;
      font-family: var(--serif); font-weight: 600; cursor: pointer;
      box-shadow: 0 1px 0 rgba(58,42,31,.03);
    }
    .chip { border: 0; border-radius: 999px; font-family: var(--sans); font-weight: 500;
      background: var(--cream-edge); min-height: 44px; padding: 12px 16px; }
    .chip.on { outline: 3px solid var(--teal); background: var(--teal-soft); color: var(--teal); }
    .station-tile.on {
      background: var(--teal); border-color: var(--teal); color: #f4fffc;
      outline: none; box-shadow: 0 2px 8px rgba(42,122,116,.28);
    }
    .station-tile .tile-state {
      display: block; font-family: var(--sans); font-size: .72rem; font-weight: 600;
      text-transform: uppercase; letter-spacing: .04em; opacity: .7; margin-top: 2px;
    }
    .station-tile.on .tile-state { opacity: .9; color: #dff5f2; }
    /* STOP — fixed footer bar; must sit above card actions (z-index), not under them */
    .stop-bar {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 50;
      padding: 10px 12px calc(16px + env(safe-area-inset-bottom, 0px));
      background: linear-gradient(180deg, transparent 0%, var(--sand) 32%, var(--sand) 100%);
      pointer-events: none;
    }
    .stop-bar .stop {
      pointer-events: auto;
      display: block; width: 100%; max-width: 456px; margin-inline: auto;
      background: var(--terracotta); color: #fff; border: 0; border-radius: 16px; min-height: 56px;
      font-size: 1.25rem; font-weight: 800; letter-spacing: .06em;
      box-shadow: 0 4px 14px rgba(196,92,62,.35);
    }
    .stop-bar .stop:active { background: var(--terracotta-deep); }
    /* Dialogs */
    dialog {
      border: 0; border-radius: 16px; padding: 18px; width: min(94vw, 420px);
      max-height: 90vh; overflow: auto; background: var(--cream); color: var(--ink);
      border: 1px solid var(--cream-edge);
    }
    dialog::backdrop { background: rgba(58,42,31,.35); }
    dialog menu { display: flex; gap: 8px; padding: 0; margin: 16px 0 0; justify-content: flex-end; flex-wrap: wrap; }
    dialog button, .row-actions button, .sched-head button, #sched-new {
      min-height: 44px; border: 0; border-radius: 10px; padding: 0 14px; font-size: 1rem;
    }
    .go { background: var(--teal); color: #fff; }
    .ghost { background: var(--cream-edge); color: var(--ink); }
    #sched-new {
      background: var(--terracotta); color: #fff; font-weight: 650;
      border-radius: 12px; padding: 0 16px;
    }
    /* Schedules — cream flat / line-art cards (no photo thumbs) */
    .sched {
      background: var(--cream); border-radius: 14px; padding: 14px; margin-bottom: 12px;
      border: 1px solid var(--cream-edge); position: relative; overflow: hidden;
    }
    .sched::after {
      content: ""; position: absolute; right: 0; bottom: 0; width: 64px; height: 40px;
      background:
        linear-gradient(135deg, transparent 40%, color-mix(in srgb, var(--sand-deep) 55%, transparent) 40%),
        radial-gradient(ellipse 40px 18px at 70% 100%, color-mix(in srgb, var(--muted) 18%, transparent), transparent);
      pointer-events: none; opacity: .7;
    }
    .sched-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; position: relative; z-index: 1; }
    .sched-title {
      flex: 1; min-width: 0; font-weight: 700; font-size: 1.08rem; font-family: var(--serif);
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .sched-head > button { flex-shrink: 0; }
    .sched-meta { color: var(--muted); font-size: .9rem; margin-top: 6px; line-height: 1.35; position: relative; z-index: 1; }
    .badges { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; position: relative; z-index: 1; }
    .badge {
      display: inline-block; background: var(--cream-edge); color: var(--ink); border-radius: 999px;
      padding: 4px 10px; font-size: .78rem;
    }
    .badge.off { background: var(--off-badge); color: #fff; }
    .badge.out { background: #f0e0c8; color: var(--out-ink); }
    .badge.season { background: var(--teal-soft); color: var(--teal); }
    .row-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; position: relative; z-index: 1; }
    .days { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }
    .days button {
      min-width: 44px; min-height: 44px; border-radius: 10px; border: 0;
      background: var(--cream-edge); color: var(--ink);
    }
    .days button.on { background: var(--teal); color: #fff; }
    label { display: block; color: var(--muted); font-size: .85rem; margin-top: 10px; }
    input, select {
      font-size: 1rem; padding: 10px; border-radius: 8px; border: 1px solid var(--cream-edge);
      width: 100%; background: #fffef9; color: var(--ink);
    }
    input[type="checkbox"] { width: auto; min-height: 22px; min-width: 22px; vertical-align: middle; margin-right: 8px; }
    .step-row { display: grid; grid-template-columns: 1fr 88px 44px; gap: 8px; align-items: end; margin-top: 8px; }
    .step-row label { margin-top: 0; }
    .collide {
      background: var(--warn-bg); color: var(--warn-ink); border-radius: 12px; padding: 12px 14px;
      margin: 0 0 12px; font-size: .92rem; border: 1px solid color-mix(in srgb, var(--warn) 45%, transparent);
    }
    .sched-toolbar { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 8px; }
    .hidden { display: none; }
    .ed-warn {
      color: var(--warn-ink); background: var(--warn-bg); border-radius: 10px;
      padding: 10px; margin-top: 10px; font-size: .9rem;
    }
    /* Optional pause banner slot — only shown if API ever exposes pause */
    .pause-banner {
      display: none; background: var(--plum); color: #f8f0f8; border-radius: 12px;
      padding: 12px 14px; margin: 0 0 12px; font-size: .95rem; font-weight: 600;
    }
    .pause-banner.visible { display: block; }
  </style>
</head>
<body>
  <header class="chrome">
    <p class="wordmark">Zanjerito</p>
    <nav class="nav">
      <button type="button" id="tab-home" class="active">Home</button>
      <button type="button" id="tab-sched" class="edit">Schedules</button>
    </nav>
  </header>
  <div id="pause-banner" class="pause-banner" role="status" hidden></div>
  <section id="page-home">
    <div class="status" id="status">
      <div class="hero-top">
        <div class="season-tag"><span class="sun-accent" aria-hidden="true"></span><span id="season-tag">Season</span></div>
      </div>
      <div class="phase" id="phase">…</div>
      <div class="timer hidden" id="timer" aria-live="polite"></div>
      <div class="sub" id="sub"></div>
      <div class="next-line" id="next-line"><span>Next:</span> <strong id="next-text">…</strong></div>
      <div class="desert-art" aria-hidden="true">
        <svg viewBox="0 0 120 90" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M0 72 C22 62, 38 78, 58 68 C78 58, 92 74, 120 64 L120 90 L0 90 Z" stroke="#b89a78" stroke-width="1.4" fill="#e4d5bc"/>
          <path d="M0 80 C28 70, 48 84, 72 74 C96 64, 108 78, 120 72" stroke="#a88868" stroke-width="1.2"/>
          <path d="M78 48 C86 36, 98 34, 108 42" stroke="#c4a074" stroke-width="1.3" stroke-linecap="round"/>
          <circle cx="96" cy="28" r="7" stroke="#d4a84a" stroke-width="1.3"/>
          <path d="M18 58 L22 48 L26 58 M22 48 L22 42" stroke="#8a9a6e" stroke-width="1.2" stroke-linecap="round"/>
          <path d="M42 62 L45 54 L48 62" stroke="#8a9a6e" stroke-width="1.1" stroke-linecap="round"/>
        </svg>
      </div>
    </div>
    <h1 class="strip-label">Stations</h1>
    <div class="strip" id="stations"></div>
  </section>
  <section id="page-schedules" class="hidden">
    <div class="sched-toolbar">
      <h1 style="margin:0">Schedules</h1>
      <button type="button" class="edit" id="sched-new">+ Add program</button>
    </div>
    <p class="sub">Programs · America/Phoenix · seasonal windows supported</p>
    <div id="collide-warn" class="collide hidden" role="status"></div>
    <div id="schedules"></div>
  </section>
  <footer class="stop-bar" aria-label="Emergency stop">
    <button type="button" class="stop" id="stop">STOP</button>
  </footer>
  <dialog id="run-dlg">
    <p id="run-msg"></p>
    <div class="strip" id="durs"></div>
    <menu>
      <button type="button" class="ghost" id="run-cancel">Cancel</button>
    </menu>
  </dialog>
  <dialog id="warn-dlg">
    <p id="warn-msg">A station is already watering. Stop it and start this manual run?</p>
    <menu>
      <button type="button" class="ghost" id="warn-no">Keep going</button>
      <button type="button" class="go" id="warn-yes">Start anyway</button>
    </menu>
  </dialog>
  <dialog id="sched-dlg">
    <h1 id="sched-dlg-title" style="margin-top:0">Edit program</h1>
    <label>Name <input id="ed-note" type="text" maxlength="120" placeholder="e.g. Front morning"></label>
    <label>Start (HH:MM) <input id="ed-start" type="time" value="06:00"></label>
    <label>Weekdays</label>
    <div class="days" id="ed-days"></div>
    <label>Season</label>
    <div class="strip" style="margin:8px 0">
      <button type="button" class="chip" id="ed-season-all" data-mode="all">All-year</button>
      <button type="button" class="chip" id="ed-season-between" data-mode="between">Between dates</button>
    </div>
    <div id="ed-season-dates" class="hidden">
      <label>Starts on <input id="ed-starts-on" type="date"></label>
      <label>Ends on <input id="ed-ends-on" type="date"></label>
    </div>
    <label>Itinerary</label>
    <div id="ed-steps"></div>
    <button type="button" class="ghost" id="ed-add-step" style="margin-top:8px;width:100%">Add step</button>
    <label style="margin-top:14px"><input id="ed-enabled" type="checkbox"> Enabled</label>
    <div id="ed-collide" class="ed-warn hidden" role="status"></div>
    <menu>
      <button type="button" class="ghost" id="ed-cancel">Cancel</button>
      <button type="button" class="go" id="ed-save">Save</button>
    </menu>
  </dialog>
  <script>
    const DAYS = ["mon","tue","wed","thu","fri","sat","sun"];
    const TZ = "America/Phoenix";
    const state = {
      status: { phase: "Idle", stations_on: [] },
      stations: [], schedules: [], pick: null, kiosk: false,
      edit: { id: null, isNew: false },
    };
    if (new URLSearchParams(location.search).get("mode") === "kiosk") {
      document.documentElement.classList.add("kiosk");
      state.kiosk = true;
    }
    const $ = (id) => document.getElementById(id);
    const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
    }[c]));
    async function j(url, opt) {
      const r = await fetch(url, opt);
      const t = await r.text();
      let body = null;
      try { body = t ? JSON.parse(t) : null; } catch { body = { error: t }; }
      if (!r.ok) throw new Error((body && body.error) || r.statusText);
      return body;
    }
    function watering() {
      const p = state.status.phase || "";
      return p && p !== "Idle";
    }
    function stationTitle(id) {
      const st = (state.stations || []).find((s) => s.id === id);
      return (st && (st.title || st.id)) || id || "";
    }
    function heroTitle() {
      const s = state.status;
      const p = s.phase || "Idle";
      // Pause not in API yet — do not invent. Style existing Idle / Watering only.
      if (p === "Idle") return "Idle";
      const name = stationTitle(s.current_station) || s.current_station;
      if (name) return "Watering • " + name;
      return "Watering";
    }
    function seasonTagLabel() {
      const month = Number(new Intl.DateTimeFormat("en-US", { timeZone: TZ, month: "numeric" }).format(new Date()));
      if (month >= 3 && month <= 5) return "Spring";
      if (month >= 6 && month <= 8) return "Summer";
      if (month >= 9 && month <= 11) return "Fall";
      return "Winter";
    }
    function programName(sch) {
      const n = (sch.note || "").trim();
      return n || sch.id || "Program";
    }
    function phoenixParts(d = new Date()) {
      const fmt = new Intl.DateTimeFormat("en-US", {
        timeZone: TZ, year: "numeric", month: "2-digit", day: "2-digit",
        hour: "2-digit", minute: "2-digit", weekday: "short", hour12: false,
      });
      const map = {};
      for (const p of fmt.formatToParts(d)) {
        if (p.type !== "literal") map[p.type] = p.value;
      }
      let hour = Number(map.hour);
      if (hour === 24) hour = 0;
      const wdShort = { Sun: "sun", Mon: "mon", Tue: "tue", Wed: "wed", Thu: "thu", Fri: "fri", Sat: "sat" };
      return {
        ymd: `${map.year}-${map.month}-${map.day}`,
        hour, minute: Number(map.minute),
        weekday: wdShort[map.weekday] || "mon",
      };
    }
    function inSeasonNow(sch, ymd) {
      if (sch.starts_on && ymd < sch.starts_on) return false;
      if (sch.ends_on && ymd > sch.ends_on) return false;
      return true;
    }
    function seasonLabel(sch) {
      if (sch.starts_on || sch.ends_on) {
        return `${sch.starts_on || "…"}–${sch.ends_on || "…"}`;
      }
      return "Year-round";
    }
    function weekdayMatches(sch, wd) {
      const days = sch.weekdays || [];
      if (!days.length) return true;
      return days.map((d) => String(d).toLowerCase()).includes(wd);
    }
    function parseHHMM(s) {
      const m = String(s || "").trim().match(/^(\d{1,2}):(\d{2})$/);
      if (!m) return null;
      const h = Number(m[1]), mi = Number(m[2]);
      if (h > 23 || mi > 59) return null;
      return { h, m: mi };
    }
    /** Next fire in America/Phoenix: next matching weekday+start still inside season window. */
    function nextFireLabel(sch) {
      const clock = parseHHMM(sch.start);
      if (!clock) return "No start time";
      const now = new Date();
      const seen = new Set();
      for (let i = 0; i < 400; i++) {
        // Phoenix has no DST; +24h walks local calendar days safely.
        const cand = new Date(now.getTime() + i * 86400000);
        const p = phoenixParts(cand);
        if (seen.has(p.ymd)) continue;
        seen.add(p.ymd);
        if (!weekdayMatches(sch, p.weekday)) continue;
        if (!inSeasonNow(sch, p.ymd)) continue;
        if (i === 0 && (p.hour > clock.h || (p.hour === clock.h && p.minute >= clock.m))) continue;
        return `${p.ymd} ${String(clock.h).padStart(2, "0")}:${String(clock.m).padStart(2, "0")}`;
      }
      return "None in window";
    }
    function globalNextLabel() {
      const enabled = (state.schedules || []).filter((s) => s.enabled);
      if (!enabled.length) return "No enabled programs";
      let best = null;
      for (const sch of enabled) {
        const label = nextFireLabel(sch);
        if (label === "No start time" || label === "None in window") continue;
        if (!best || label < best.label) best = { label, name: programName(sch) };
      }
      if (!best) return "None in window";
      return `${best.label} · ${best.name}`;
    }
    function weekdaysOverlap(a, b) {
      const A = (a.weekdays || []).map((d) => String(d).toLowerCase());
      const B = (b.weekdays || []).map((d) => String(d).toLowerCase());
      if (!A.length || !B.length) return true;
      return A.some((d) => B.includes(d));
    }
    function collidePairs(list) {
      const enabled = (list || []).filter((s) => s.enabled);
      const pairs = [];
      for (let i = 0; i < enabled.length; i++) {
        for (let j = i + 1; j < enabled.length; j++) {
          const a = enabled[i], b = enabled[j];
          if ((a.start || "") === (b.start || "") && a.start && weekdaysOverlap(a, b)) {
            pairs.push([a, b]);
          }
        }
      }
      return pairs;
    }
    function paintCollide() {
      const box = $("collide-warn");
      const pairs = collidePairs(state.schedules);
      if (!pairs.length) {
        box.classList.add("hidden");
        box.textContent = "";
        return;
      }
      const bits = pairs.map(([a, b]) =>
        `${programName(a)} and ${programName(b)} both at ${a.start}`);
      box.textContent = "Soft warning: enabled programs share a start time on overlapping days — " +
        bits.join("; ") + ". Engine skips if already watering (D13). Save is still allowed.";
      box.classList.remove("hidden");
    }
    function paintPauseBanner() {
      // Webpage pause (rain/mowing) is out of scope — only show if API already exposes it.
      const s = state.status || {};
      const paused = !!(s.paused || s.pause || s.lockout === true || s.phase === "Paused");
      const banner = $("pause-banner");
      if (!paused) {
        banner.classList.remove("visible");
        banner.hidden = true;
        banner.textContent = "";
        return;
      }
      banner.hidden = false;
      banner.classList.add("visible");
      banner.textContent = "Paused — schedules held. STOP still available.";
    }
    function paintStatus() {
      const s = state.status;
      $("season-tag").textContent = seasonTagLabel();
      $("phase").textContent = heroTitle();
      const isWater = watering();
      $("status").classList.toggle("watering", isWater);
      const timer = $("timer");
      if (isWater) {
        // No remaining-seconds field — teal timer shows clock only (hero already Watering • station).
        // Do not echo raw engine phases like "Running".
        const bits = [];
        if (s.now) bits.push(s.now.replace("T", " ").slice(11, 19));
        timer.textContent = bits.length ? bits.join(" · ") : "In progress";
        timer.classList.remove("hidden");
      } else {
        timer.textContent = "";
        timer.classList.add("hidden");
      }
      const bits = [];
      if (s.last_error) bits.push(s.last_error);
      else if (!isWater) bits.push("Phoenix · ready");
      $("sub").textContent = bits.join(" · ") || "";
      $("sub").classList.toggle("fault", !!s.last_error);
      $("next-text").textContent = globalNextLabel();
      paintPauseBanner();
      document.querySelectorAll("#stations .station-tile").forEach((el) => {
        const on = (s.stations_on || []).includes(el.dataset.id) || s.current_station === el.dataset.id;
        el.classList.toggle("on", on);
        const st = el.querySelector(".tile-state");
        if (st) st.textContent = on ? "On" : "Off";
      });
    }
    function paintStations() {
      $("stations").innerHTML = "";
      (state.stations || []).forEach((st) => {
        const b = document.createElement("button");
        b.type = "button";
        b.className = "station-tile";
        b.dataset.id = st.id;
        // API titles/ids as today — do not rename stations.
        b.innerHTML = `${esc(st.title || st.id)}<span class="tile-state">Off</span>`;
        b.addEventListener("click", () => openRun(st));
        $("stations").appendChild(b);
      });
      paintStatus();
    }
    function paintSchedules() {
      const box = $("schedules");
      box.innerHTML = "";
      const today = phoenixParts().ymd;
      (state.schedules || []).forEach((sch) => {
        const el = document.createElement("article");
        el.className = "sched";
        const out = !inSeasonNow(sch, today);
        const onBadge = sch.enabled
          ? `<span class="badge">On</span>`
          : `<span class="badge off">Off</span>`;
        const seasonBadge = `<span class="badge season">${esc(seasonLabel(sch))}</span>`;
        const outBadge = out ? `<span class="badge out">Out of season</span>` : "";
        el.innerHTML = `
          <div class="sched-head">
            <div class="sched-title">${esc(programName(sch))}</div>
            <button type="button" class="ghost" data-toggle>${sch.enabled ? "Disable" : "Enable"}</button>
          </div>
          <div class="sched-meta">Next: ${esc(nextFireLabel(sch))}</div>
          <div class="badges">${onBadge}${seasonBadge}${outBadge}</div>
          <div class="row-actions">
            <button type="button" class="go edit" data-edit>Edit</button>
            <button type="button" class="ghost edit" data-dup>Duplicate</button>
          </div>`;
        el.querySelector("[data-toggle]").addEventListener("click", () => toggleEnabled(sch));
        el.querySelector("[data-edit]").addEventListener("click", () => openEditor(sch, false));
        el.querySelector("[data-dup]").addEventListener("click", () => openEditor(sch, true));
        box.appendChild(el);
      });
      if (!(state.schedules || []).length) {
        box.innerHTML = `<p class="sub">No programs yet. Tap + Add program to add one.</p>`;
      }
      paintCollide();
      paintStatus();
    }
    function mintId(note) {
      const slug = String(note || "").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "").slice(0, 24);
      const base = slug ? `prog-${slug}` : `prog-${Date.now()}`;
      const ids = new Set((state.schedules || []).map((s) => s.id));
      if (!ids.has(base)) return base;
      let n = 2;
      while (ids.has(`${base}-${n}`)) n++;
      return `${base}-${n}`;
    }
    function stationOptions(selected) {
      return (state.stations || []).map((st) =>
        `<option value="${esc(st.id)}" ${st.id === selected ? "selected" : ""}>${esc(st.title || st.id)}</option>`
      ).join("");
    }
    function renderEdDays(selected) {
      const set = new Set((selected || []).map((d) => String(d).toLowerCase()));
      const allOn = set.size === 0;
      $("ed-days").innerHTML = DAYS.map((d) =>
        `<button type="button" data-day="${d}" class="${allOn || set.has(d) ? "on" : ""}">${d.slice(0,2)}</button>`
      ).join("");
      $("ed-days").querySelectorAll("[data-day]").forEach((b) => {
        b.addEventListener("click", () => b.classList.toggle("on"));
      });
    }
    function renderEdSteps(steps) {
      const box = $("ed-steps");
      box.innerHTML = "";
      const list = (steps && steps.length) ? steps : [{ station_id: (state.stations[0] || {}).id || "", minutes: 5 }];
      list.forEach((step, i) => {
        const row = document.createElement("div");
        row.className = "step-row";
        row.innerHTML = `
          <label>Station<select data-st>${stationOptions(step.station_id)}</select></label>
          <label>Min<input data-min type="number" min="1" max="180" value="${esc(step.minutes || 5)}"></label>
          <button type="button" class="ghost" data-rm title="Remove">×</button>`;
        row.querySelector("[data-rm]").addEventListener("click", () => {
          row.remove();
          if (!$("ed-steps").children.length) renderEdSteps([]);
        });
        box.appendChild(row);
      });
    }
    function setSeasonMode(mode) {
      const between = mode === "between";
      $("ed-season-all").classList.toggle("on", !between);
      $("ed-season-between").classList.toggle("on", between);
      $("ed-season-dates").classList.toggle("hidden", !between);
      if (!between) {
        $("ed-starts-on").value = "";
        $("ed-ends-on").value = "";
      }
    }
    function openEditor(sch, asDup) {
      const src = sch || {
        id: "", enabled: true, note: "", weekdays: [], start: "06:00",
        steps: [], starts_on: "", ends_on: "",
      };
      const isNew = !sch || asDup;
      let id = src.id;
      if (asDup) {
        id = mintId((src.note || src.id || "copy") + "-copy");
      } else if (!sch) {
        id = mintId("program");
      }
      state.edit = { id, isNew };
      $("sched-dlg-title").textContent = asDup ? "Duplicate program" : (sch ? "Edit program" : "New program");
      $("ed-note").value = asDup ? `${programName(src)} copy` : (src.note || "");
      $("ed-start").value = src.start || "06:00";
      $("ed-enabled").checked = !!src.enabled;
      renderEdDays(src.weekdays || []);
      const seasonal = !!(src.starts_on || src.ends_on);
      setSeasonMode(seasonal ? "between" : "all");
      if (seasonal) {
        $("ed-starts-on").value = src.starts_on || "";
        $("ed-ends-on").value = src.ends_on || "";
      }
      const steps = (src.steps || []).map((s) => ({ station_id: s.station_id, minutes: s.minutes }));
      renderEdSteps(asDup || sch ? steps : []);
      updateEdCollide();
      $("sched-dlg").showModal();
    }
    function readEditorDraft() {
      let weekdays = [...$("ed-days").querySelectorAll("[data-day].on")].map((b) => b.dataset.day);
      if (weekdays.length === DAYS.length) weekdays = []; // empty = every day
      const between = $("ed-season-between").classList.contains("on");
      const steps = [...$("ed-steps").querySelectorAll(".step-row")].map((row) => ({
        station_id: row.querySelector("[data-st]").value,
        minutes: Number(row.querySelector("[data-min]").value) || 1,
      })).filter((s) => s.station_id);
      return {
        id: state.edit.id,
        enabled: $("ed-enabled").checked,
        note: $("ed-note").value.trim(),
        weekdays,
        start: $("ed-start").value || "06:00",
        steps,
        starts_on: between ? ($("ed-starts-on").value || "") : "",
        ends_on: between ? ($("ed-ends-on").value || "") : "",
      };
    }
    function updateEdCollide() {
      const draft = readEditorDraft();
      const others = (state.schedules || []).filter((s) => s.id !== draft.id);
      const merged = [...others, draft];
      const pairs = collidePairs(merged).filter(([a, b]) => a.id === draft.id || b.id === draft.id);
      const box = $("ed-collide");
      if (!draft.enabled || !pairs.length) {
        box.classList.add("hidden");
        box.textContent = "";
        return;
      }
      box.textContent = "Soft warning: this start overlaps another enabled program on shared weekdays. Save still allowed.";
      box.classList.remove("hidden");
    }
    async function saveEditor() {
      const body = readEditorDraft();
      if (!body.id) body.id = mintId(body.note);
      if (!body.steps.length) {
        alert("Add at least one itinerary step.");
        return;
      }
      await j("/api/schedules/" + encodeURIComponent(body.id), {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body),
      });
      $("sched-dlg").close();
      await loadSchedules();
    }
    async function toggleEnabled(sch) {
      const next = { ...sch, enabled: !sch.enabled };
      await j("/api/schedules/" + encodeURIComponent(sch.id), {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          id: sch.id,
          enabled: next.enabled,
          note: sch.note || "",
          weekdays: sch.weekdays || [],
          start: sch.start || "06:00",
          steps: sch.steps || [],
          starts_on: sch.starts_on || "",
          ends_on: sch.ends_on || "",
        }),
      });
      await loadSchedules();
    }
    function openRun(st) {
      state.pick = st;
      $("run-msg").textContent = "Run " + (st.title || st.id) + " for…";
      const durs = $("durs");
      durs.innerHTML = "";
      [1, 5, 10].forEach((m) => {
        const b = document.createElement("button");
        b.type = "button";
        b.className = "chip go";
        b.textContent = m + " min";
        b.addEventListener("click", () => confirmRun(st, m * 60));
        durs.appendChild(b);
      });
      $("run-dlg").showModal();
    }
    function confirmRun(st, sec) {
      $("run-dlg").close();
      if (watering()) {
        $("warn-msg").textContent = (state.status.current_station || "A station") +
          " is watering. Stop it and run " + (st.title || st.id) + "?";
        $("warn-dlg").dataset.sec = String(sec);
        $("warn-dlg").dataset.id = st.id;
        $("warn-dlg").showModal();
        return;
      }
      startRun(st.id, sec, false);
    }
    async function startRun(id, sec, preempt) {
      await j("/api/stations/" + encodeURIComponent(id) + "/run", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ durationSec: sec, preempt }),
      });
    }
    $("run-cancel").addEventListener("click", () => $("run-dlg").close());
    $("warn-no").addEventListener("click", () => $("warn-dlg").close());
    $("warn-yes").addEventListener("click", () => {
      const d = $("warn-dlg");
      d.close();
      startRun(d.dataset.id, Number(d.dataset.sec), true);
    });
    $("stop").addEventListener("click", () => {
      j("/api/run/cancel", { method: "POST" }).catch((e) => alert(e.message));
    });
    $("tab-home").addEventListener("click", () => {
      $("page-home").classList.remove("hidden");
      $("page-schedules").classList.add("hidden");
      $("tab-home").classList.add("active");
      $("tab-sched").classList.remove("active");
    });
    $("tab-sched").addEventListener("click", () => {
      $("page-home").classList.add("hidden");
      $("page-schedules").classList.remove("hidden");
      $("tab-home").classList.remove("active");
      $("tab-sched").classList.add("active");
    });
    $("sched-new").addEventListener("click", () => openEditor(null, false));
    $("ed-cancel").addEventListener("click", () => $("sched-dlg").close());
    $("ed-save").addEventListener("click", () => saveEditor().catch((e) => alert(e.message)));
    $("ed-add-step").addEventListener("click", () => {
      const cur = [...$("ed-steps").querySelectorAll(".step-row")].map((row) => ({
        station_id: row.querySelector("[data-st]").value,
        minutes: Number(row.querySelector("[data-min]").value) || 5,
      }));
      cur.push({ station_id: (state.stations[0] || {}).id || "", minutes: 5 });
      renderEdSteps(cur);
    });
    $("ed-season-all").addEventListener("click", () => setSeasonMode("all"));
    $("ed-season-between").addEventListener("click", () => {
      setSeasonMode("between");
      if (!$("ed-starts-on").value) {
        const ymd = phoenixParts().ymd;
        $("ed-starts-on").value = ymd;
      }
    });
    ["ed-start", "ed-enabled"].forEach((id) => {
      $(id).addEventListener("change", updateEdCollide);
      $(id).addEventListener("input", updateEdCollide);
    });
    $("ed-days").addEventListener("click", () => setTimeout(updateEdCollide, 0));
    async function loadStations() {
      const d = await j("/api/stations");
      state.stations = d.stations || [];
      paintStations();
    }
    async function loadSchedules() {
      const d = await j("/api/schedules");
      state.schedules = d.schedules || [];
      paintSchedules();
    }
    async function loadStatus() {
      state.status = await j("/api/status");
      paintStatus();
    }
    function hookSSE() {
      try {
        const es = new EventSource("/api/events");
        es.addEventListener("status", (ev) => {
          try { Object.assign(state.status, JSON.parse(ev.data)); paintStatus(); } catch (e) {}
        });
      } catch (e) {}
    }
    loadStatus();
    loadStations();
    loadSchedules();
    hookSSE();
    setInterval(loadStatus, 4000);
  </script>
</body>
</html>
